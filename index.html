<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="referrer" content="origin">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Geotagged Photo Map</title>

<link rel="stylesheet"
      href="resources/leaflet.css">


<style>

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

}

#map {

    width: 100%;
    height: 100%;

}

.photo-popup {

    text-align: center;

}

.photo-popup img {

    display: block;

    margin-left: auto;
    margin-right: auto;
    margin-bottom: 8px;

    max-width: 180px;

    height: auto;

}

.photo-name {

    font-weight: bold;

    margin-bottom: 5px;

}

.coordinates {

    font-size: 11px;

    color: #555;

}

</style>

</head>


<body>

<div id="map"></div>


<script src="resources/leaflet.js"></script>


<script>

// ========================================================
// PHOTO DATA
// ========================================================

const photos = [
    {
        "filename": "IMG_3082.jpeg",
        "latitude": -44.33987777777778,
        "longitude": -176.17405833333333,
        "image": "images/1.jpeg",
        "thumbnail": "thumbnails/1.jpg"
    },
    {
        "filename": "IMG_3148.jpeg",
        "latitude": -44.34366111111111,
        "longitude": -176.17266944444444,
        "image": "images/2.jpeg",
        "thumbnail": "thumbnails/2.jpg"
    },
    {
        "filename": "IMG_3226.jpeg",
        "latitude": -44.34378888888889,
        "longitude": -176.179,
        "image": "images/3.jpeg",
        "thumbnail": "thumbnails/3.jpg"
    }
];


// ========================================================
// MAP
// ========================================================

const map = L.map("map");


// ========================================================
// OPENSTREETMAP
// ========================================================

const osm = L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

);


// OSM is the default background.

osm.addTo(map);


// ========================================================
// PHOTO POINTS
// ========================================================

const markers = [];


photos.forEach(function(photo){

    const marker = L.circleMarker(

        [
            photo.latitude,
            photo.longitude
        ],

        {

            radius: 7,

            color: "black",

            fillColor: "yellow",

            weight: 2,

            fillOpacity: 1.0

        }

    );


    const popup = `

        <div class="photo-popup">

            <div class="photo-name">

                ${photo.filename}

            </div>


            <a href="${photo.image}">

                <img

                    src="${photo.thumbnail}"

                    alt="${photo.filename}"

                >

            </a>


            <div>

                Click thumbnail for full image

            </div>


            <div class="coordinates">

                ${photo.latitude.toFixed(6)},

                ${photo.longitude.toFixed(6)}

            </div>

        </div>

    `;


    marker.bindPopup(popup);


    marker.bindTooltip(
        photo.filename
    );


    marker.addTo(map);


    markers.push(marker);

});


// ========================================================
// OPTIONAL GEOTIFF
// ========================================================




// ========================================================
// FIT MAP TO PHOTOGRAPHS
// ========================================================

if (markers.length > 0) {

    const group = L.featureGroup(
        markers
    );

    map.fitBounds(
        group.getBounds().pad(0.15)
    );

}

else {

    map.setView(
        [-41.2865, 174.7762],
        10
    );

}

</script>

</body>

</html>
